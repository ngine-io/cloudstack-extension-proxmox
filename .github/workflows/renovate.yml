name: Renovate

on:
  schedule:
    - cron: '12 */4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: Renovate log level
        type: choice
        options: [info, debug]
        default: info
      dryRun:
        description: Run without creating branches, PRs or issues
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A run can take minutes; never let two overlap on the same repository.
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.4
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The configuration is committed, so skip the onboarding pull request
          # and stop rather than run with defaults if it ever goes missing.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: 'required'
          # Vulnerability alerts from the OSV database, which covers Maven.
          # Self-hosted only, hence here and not in renovate.json5.
          RENOVATE_OSV_VULNERABILITY_ALERTS: 'true'
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_GIT_AUTHOR: "Renovate Bot <renovate[bot]@users.noreply.github.com>"
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
