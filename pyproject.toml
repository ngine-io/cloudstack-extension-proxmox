[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudstack-extension-proxmox-ngine"
dynamic = ["version"]
description = "Proxmox VE extension for Apache CloudStack"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Rene Moser", email = "mail@renemoser.net" }]
keywords = ["cloudstack", "proxmox", "extension", "virtualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# No runtime dependencies on purpose: CloudStack runs the extension with the
# management server's system interpreter.
dependencies = []

[project.urls]
Homepage = "https://github.com/ngine-io/cloudstack-extension-proxmox"
Source = "https://github.com/ngine-io/cloudstack-extension-proxmox"
Issues = "https://github.com/ngine-io/cloudstack-extension-proxmox/issues"

[project.scripts]
cloudstack-extension-proxmox = "cloudstack_extension_proxmox_ngine.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.3",
]

[tool.hatch.version]
path = "src/cloudstack_extension_proxmox_ngine/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudstack_extension_proxmox_ngine"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["cloudstack_extension_proxmox_ngine"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
    "S",    # flake8-bandit
    "D",    # pydocstyle
]
ignore = [
    "D100",  # module docstrings are present where they add value
    "D104",
    "D107",  # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true

[tool.black]
line-length = 88
target-version = ["py310"]
